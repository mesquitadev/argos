server {
    listen 8080;

    # Quem pode ver. Sem isto, qualquer pessoa na rede — inclusive uma visita
    # no Wi-Fi — abre o endereço e assiste à casa ao vivo, com todo o histórico.
    #
    # `auth_request` pergunta à API antes de servir; a API valida o cookie
    # assinado. Ficam de fora só a tela de login e o que ela precisa para
    # aparecer, senão não haveria como entrar.
    # O DNS interno do Docker. Sem `resolver`, o nginx resolve o nome da API
    # uma vez ao carregar e guarda o IP; recriar o container muda o IP e tudo
    # vira 502 até alguém reiniciar o nginx. Com a variável abaixo, a resolução
    # acontece a cada requisição.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api/auth {
        internal;
        set $api_auth http://api:8090/api/auth;
        proxy_pass $api_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location /api/ {
        set $api http://api:8090;
        proxy_pass $api;
        proxy_set_header Host $host;
        # Exportar um trecho longo demora; o padrão de 60s cortaria no meio.
        proxy_read_timeout 900s;
    }

    # A aplicação web, servida pelo mesmo nginx que já entrega o HLS e as
    # gravações — tudo na mesma origem, sem CORS e sem uma segunda porta.
    #
    # As locations /live/ e /recordings/ abaixo têm prefixo mais específico e
    # vencem esta, então a raiz nunca engole as chamadas de dados.
    location / {
        # A aplicação em si não é segredo — ela mostra a tela de login quando a
        # sessão não vale. Proteger aqui só daria erro em vez de tela de login.
        root /web;
        try_files $uri /index.html;
    }
    # O index não pode ser cacheado, senão uma versão nova nunca chega; os
    # arquivos em /assets/ têm hash no nome e podem ser cacheados para sempre.
    location = /index.html {
        root /web;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        root /web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Fluxo ao vivo e índice.
    location /live/ {
        auth_request /api/auth;
        alias /hls/;
        # Manifesto HLS não pode ser cacheado: cada leitura precisa trazer os
        # segmentos novos, senão o ao vivo congela na primeira lista.
        add_header Cache-Control "no-cache, no-store";
        # O tipo de cada peça precisa estar certo: o AVPlayer recusa um
        # segmento servido como octet-stream.
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/iso.segment m4s;
            video/mp4 mp4;
            application/json json;
        }
    }
    # Gravações, servidas diretamente.
    location /recordings/ {
        auth_request /api/auth;
        alias /recordings/;
        autoindex on;
        autoindex_format json;
    }
}
