server {
    listen 8080;
    # Fluxo ao vivo e índice.
    location /live/ {
        alias /hls/;
        # Manifesto HLS não pode ser cacheado: cada leitura precisa trazer os
        # segmentos novos, senão o ao vivo congela na primeira lista.
        add_header Cache-Control "no-cache, no-store";
        # O tipo de cada peça precisa estar certo: o AVPlayer recusa um
        # segmento servido como octet-stream.
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/iso.segment m4s;
            video/mp4 mp4;
            application/json json;
        }
    }
    # Gravações, servidas diretamente.
    location /recordings/ {
        alias /recordings/;
        autoindex on;
        autoindex_format json;
    }
}
