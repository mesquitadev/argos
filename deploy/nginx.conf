server {
    listen 8080;

    # A aplicação web, servida pelo mesmo nginx que já entrega o HLS e as
    # gravações — tudo na mesma origem, sem CORS e sem uma segunda porta.
    #
    # As locations /live/ e /recordings/ abaixo têm prefixo mais específico e
    # vencem esta, então a raiz nunca engole as chamadas de dados.
    location / {
        root /web;
        try_files $uri /index.html;
    }
    # O index não pode ser cacheado, senão uma versão nova nunca chega; os
    # arquivos em /assets/ têm hash no nome e podem ser cacheados para sempre.
    location = /index.html {
        root /web;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        root /web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Fluxo ao vivo e índice.
    location /live/ {
        alias /hls/;
        # Manifesto HLS não pode ser cacheado: cada leitura precisa trazer os
        # segmentos novos, senão o ao vivo congela na primeira lista.
        add_header Cache-Control "no-cache, no-store";
        # O tipo de cada peça precisa estar certo: o AVPlayer recusa um
        # segmento servido como octet-stream.
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/iso.segment m4s;
            video/mp4 mp4;
            application/json json;
        }
    }
    # Gravações, servidas diretamente.
    location /recordings/ {
        alias /recordings/;
        autoindex on;
        autoindex_format json;
    }
}
