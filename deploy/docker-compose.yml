# Gravador da câmera. Roda no servidor, 24 horas por dia, independente do Mac.
services:
  recorder:
    image: linuxserver/ffmpeg:latest
    container_name: vigia-recorder
    # `entrypoint` porque a imagem já aponta para o ffmpeg; aqui trocamos por um
    # laço que reinicia a captura quando a câmera cai, sem derrubar o container.
    entrypoint: ["/bin/sh", "/config/record.sh"]
    volumes:
      - ./record.sh:/config/record.sh:ro
      - ${RECORDINGS_PATH:-/srv/vigia}:/recordings
    environment:
      TZ: America/Fortaleza
      CAMERA_ID: ${CAMERA_ID:-cam1}
      RTSP_URL: ${RTSP_URL:?defina RTSP_URL no .env}
      SEGMENT_SECONDS: ${SEGMENT_SECONDS:-600}
    restart: unless-stopped
    # Sem limite de memória o ffmpeg pode crescer com buffers em rede instável.
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  retention:
    image: alpine:3.20
    container_name: vigia-retention
    entrypoint: ["/bin/sh", "/config/retention.sh"]
    volumes:
      - ./retention.sh:/config/retention.sh:ro
      - ${RECORDINGS_PATH:-/srv/vigia}:/recordings
    environment:
      TZ: America/Fortaleza
      # Teto de espaço e idade. O que vier primeiro manda — igual a um DVR.
      MAX_GB: ${MAX_GB:-700}
      MAX_DAYS: ${MAX_DAYS:-30}
      MIN_FREE_GB: ${MIN_FREE_GB:-20}
      CHECK_MINUTES: ${CHECK_MINUTES:-10}
    restart: unless-stopped
    mem_limit: 64m

  # Converte o fluxo em HLS para o app reproduzir nativamente, sem VLCKit.
  hls:
    image: linuxserver/ffmpeg:latest
    container_name: vigia-hls
    entrypoint: ["/bin/sh", "/config/hls.sh"]
    volumes:
      - ./hls.sh:/config/hls.sh:ro
      - hls-data:/hls
    environment:
      TZ: America/Fortaleza
      CAMERA_ID: ${CAMERA_ID:-cam1}
      RTSP_URL: ${RTSP_URL:?defina RTSP_URL no .env}
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # Mantém o índice das gravações em dia.
  indexer:
    image: alpine:3.20
    container_name: vigia-indexer
    entrypoint: ["/bin/sh", "/config/index.sh"]
    volumes:
      - ./index.sh:/config/index.sh:ro
      - ${RECORDINGS_PATH:-/srv/vigia}:/recordings:ro
      - hls-data:/hls
    environment:
      TZ: America/Fortaleza
      CAMERA_ID: ${CAMERA_ID:-cam1}
    restart: unless-stopped
    mem_limit: 64m

  # Serve o ao vivo, o índice e as gravações para o app.
  web:
    image: nginx:alpine
    container_name: vigia-web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - hls-data:/hls:ro
      - ${RECORDINGS_PATH:-/srv/vigia}:/recordings:ro
    ports:
      - "${WEB_PORT:-8088}:8080"
    restart: unless-stopped
    mem_limit: 64m

  # Escuta os eventos que a câmera publica — movimento, perda de sinal — e os
  # registra para a linha do tempo do app.
  events:
    image: python:3.12-alpine
    container_name: vigia-events
    command: ["python", "-u", "/config/events.py"]
    volumes:
      - ./events.py:/config/events.py:ro
      - hls-data:/hls
    environment:
      TZ: America/Fortaleza
      CAMERA_ID: ${CAMERA_ID:-cam1}
      CAMERA_HOST: ${CAMERA_HOST:?defina CAMERA_HOST no .env}
      CAMERA_USER: ${CAMERA_USER:?defina CAMERA_USER no .env}
      CAMERA_PASSWORD: ${CAMERA_PASSWORD:?defina CAMERA_PASSWORD no .env}
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  mdns:
    container_name: vigia-mdns
    image: python:3.12-alpine
    restart: unless-stopped
    # mDNS é multicast: de dentro de uma rede isolada do Docker o anúncio não
    # alcança ninguém, então este serviço compartilha a rede do host.
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command: ["pip install --quiet --no-cache-dir zeroconf && exec python -u /config/announce.py"]
    volumes:
      - ./announce.py:/config/announce.py:ro
    environment:
      TZ: America/Fortaleza
      WEB_PORT: "8088"
      CAMERA_ID: cam1

volumes:
  hls-data:
