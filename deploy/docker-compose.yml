# Gravador da câmera. Roda no servidor, 24 horas por dia, independente do Mac.
services:
  retention:
    image: alpine:3.20
    container_name: argos-retention
    entrypoint: ["/bin/sh", "/app/retention.sh"]
    volumes:
      - ./api-config:/config
      - ./retention.sh:/app/retention.sh:ro
      - ${RECORDINGS_PATH:-/srv/argos}:/recordings
    environment:
      TZ: America/Fortaleza
      # Teto de espaço e idade. O que vier primeiro manda — igual a um DVR.
      MAX_GB: ${MAX_GB:-700}
      MAX_DAYS: ${MAX_DAYS:-30}
      MIN_FREE_GB: ${MIN_FREE_GB:-20}
      CHECK_MINUTES: ${CHECK_MINUTES:-10}
    restart: unless-stopped
    mem_limit: 64m

  # Converte o fluxo em HLS para o app reproduzir nativamente, sem VLCKit.
  web:
    image: nginx:alpine
    container_name: argos-web
    network_mode: host
    volumes:
      - ./web:/web:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - hls-data:/hls:ro
      - ${RECORDINGS_PATH:-/srv/argos}:/recordings:ro
    restart: unless-stopped
    mem_limit: 64m

  # Escuta os eventos que a câmera publica — movimento, perda de sinal — e os
  # registra para a linha do tempo do app.
  events:
    image: python:3.12-alpine
    container_name: argos-events
    command: ["python", "-u", "/config/events.py"]
    volumes:
      - ./api-config:/config-cameras:ro
      - ./events.py:/config/events.py:ro
      - hls-data:/hls
    environment:
      CAMERAS_FILE: /config-cameras/cameras.json
      TZ: America/Fortaleza
      CAMERA_ID: ${CAMERA_ID:-cam1}
      CAMERA_HOST: ${CAMERA_HOST:?defina CAMERA_HOST no .env}
      CAMERA_USER: ${CAMERA_USER:?defina CAMERA_USER no .env}
      CAMERA_PASSWORD: ${CAMERA_PASSWORD:?defina CAMERA_PASSWORD no .env}
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  mdns:
    container_name: argos-mdns
    image: python:3.12-alpine
    restart: unless-stopped
    # mDNS é multicast: de dentro de uma rede isolada do Docker o anúncio não
    # alcança ninguém, então este serviço compartilha a rede do host.
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command: ["pip install --quiet --no-cache-dir zeroconf && exec python -u /config/announce.py"]
    volumes:
      - ./announce.py:/config/announce.py:ro
    environment:
      TZ: America/Fortaleza
      WEB_PORT: "8088"
      CAMERA_ID: cam1

  api:
    container_name: argos-api
    build: ./api
    network_mode: host
    restart: unless-stopped
    volumes:
      - hls-data:/hls:ro
      - ./api-config:/config
      - ${RECORDINGS_PATH:-/srv/argos}:/recordings:ro
      - ./exports:/exports
    environment:
      TZ: America/Fortaleza
      CAMERA_ID: cam1
      PORT: "8090"
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}

  supervisor:
    container_name: argos-supervisor
    # Mesma imagem da API: precisa de Python e ffmpeg, exatamente como ela.
    build: ./api
    restart: unless-stopped
    command: ["python3", "/config/supervisor.py"]
    volumes:
      - ./supervisor.py:/config/supervisor.py:ro
      - ./api-config:/config-cameras:ro
      - ${RECORDINGS_PATH:-/srv/argos}:/recordings
      - hls-data:/hls
    environment:
      TZ: America/Fortaleza
      CAMERAS_FILE: /config-cameras/cameras.json
      SEGMENT_SECONDS: ${SEGMENT_SECONDS:-300}

  detector:
    container_name: argos-detector
    build:
      context: .
      dockerfile: Dockerfile.detector
    restart: unless-stopped
    volumes:
      - ./api-config:/config-cameras:ro
      - hls-data:/hls
    environment:
      TZ: America/Fortaleza
      CAMERAS_FILE: /config-cameras/cameras.json
      # Um núcleo: o resto da máquina está gravando, e detecção que atropela a
      # gravação troca uma conveniência por uma função essencial.
      THREADS: "1"
      CONFIANCA: "0.35"
    mem_limit: 768m

volumes:
  hls-data:
